[build-system]
requires = ["scikit-build-core", "nanobind"]
build-backend = "scikit_build_core.build"

[project]
name = "Kepler"
version = "0.1.0"
description = "Keplerian elements <-> Cartesian state and two-body propagation (C++/Eigen/nanobind)"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = []          # в пакете только скомпилированный модуль

[tool.scikit-build.cmake.define]
KEPLER_PYTHON = "ON"         # при pip install включаем сборку bindings/